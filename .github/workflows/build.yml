name: Build website and Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the web app inside the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/* android/app/src/main/assets/www/
          rm -f android/app/src/main/assets/www/sw.js
      - name: Signing key
        env:
          KS_B64: ${{ secrets.RIVERA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rivera.jks"
            echo "RIVERA_KEYSTORE=$RUNNER_TEMP/rivera.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No RIVERA_KEYSTORE_B64 secret - APK is signed with a temporary debug key"
          fi
      - name: Build APK
        working-directory: android
        env:
          RIVERA_KS_PASS: ${{ secrets.RIVERA_KS_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/RiveraQuoteStudio.apk
          cp dist/RiveraQuoteStudio.apk "dist/RiveraQuoteStudio-v1.0.${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: RiveraQuoteStudio-apk
          path: dist/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rivera Quote Studio v1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Android app for Rivera Quote Studio.
            Install: download RiveraQuoteStudio.apk on the phone, open it, allow "Install unknown apps" for your browser / file manager once.
          files: dist/*.apk

  windows:
    name: Windows desktop app
    runs-on: windows-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle the web app
        shell: bash
        run: |
          mkdir -p desktop/web
          cp -r web/* desktop/web/
          rm -f desktop/web/sw.js
      - name: Build installer and portable exe
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never -c.extraMetadata.version=1.0.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: RiveraQuoteStudio-windows
          path: desktop/dist/*.exe
      - name: Add to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            desktop/dist/RiveraQuoteStudio-Setup.exe
            desktop/dist/RiveraQuoteStudio-Setup.exe.blockmap
            desktop/dist/RiveraQuoteStudio-Portable.exe
            desktop/dist/latest.yml
