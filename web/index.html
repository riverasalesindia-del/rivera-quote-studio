<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rivera Quote Studio</title>
<meta name="description" content="Rivera Coil Manufacturing sales app — scan quotations, build quote workings, issue quotations, file to Synology.">
<meta name="theme-color" content="#02315B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rivera Quotes">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Roboto+Slab:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workshop console — fixed left rail of stations (desktop) / bottom tab bar (phone); each station is a work surface of panels on a cool steel ground with copper as the single accent. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#14212E; --muted:#5A6A77; --line:#D6DDDB; --line-2:#C3CCCA;
  --copper:#E25E00; --copper-ink:#B84A00; --copper-soft:#FFE9D9; --navy:#02315B; --navy-soft:#E1ECF6; --sky:#02A9F0;
  --ok:#2D7A4D; --ok-soft:#E1F1E6; --warn:#9A6411; --warn-soft:#FBEFD9; --bad:#B02A1F; --bad-soft:#F9E1DE;
  --rail:#02315B; --rail-ink:#C9D6E2; --rail-active:#FFFFFF;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px; --shadow:0 1px 2px rgba(20,33,46,.06),0 4px 14px rgba(20,33,46,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#141E28; --sunk:#101820; --ink:#E5ECF1; --muted:#93A3B1; --line:#253342; --line-2:#33475A;
  --copper:#FF8A3D; --copper-ink:#FFA66B; --copper-soft:#3A2210; --navy:#8EC5F0; --navy-soft:#132A40; --sky:#38BDF8;
  --ok:#5FC28A; --ok-soft:#14301F; --warn:#E3B15A; --warn-soft:#33270F; --bad:#F07A6E; --bad-soft:#3A1714;
  --rail:#021F3A; --rail-ink:#9FB2C3; --rail-active:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#141E28; --sunk:#101820; --ink:#E5ECF1; --muted:#93A3B1; --line:#253342; --line-2:#33475A;
  --copper:#FF8A3D; --copper-ink:#FFA66B; --copper-soft:#3A2210; --navy:#8EC5F0; --navy-soft:#132A40; --sky:#38BDF8;
  --ok:#5FC28A; --ok-soft:#14301F; --warn:#E3B15A; --warn-soft:#33270F; --bad:#F07A6E; --bad-soft:#3A1714;
  --rail:#021F3A; --rail-ink:#9FB2C3; --rail-active:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--rail)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;letter-spacing:.005em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.65rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
a{color:var(--copper-ink)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:18px 12px 14px max(12px,env(safe-area-inset-left,0px));gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand svg{flex:none}
.brand b{display:block;font-family:"Roboto Slab",Georgia,serif;font-weight:700;letter-spacing:.14em;color:#fff;font-size:1.1rem;line-height:1}
.brand small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#FF9A4D;margin-top:4px}
.brand img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:rgba(254,105,2,.18);color:var(--rail-active);box-shadow:inset 3px 0 0 #FE6902}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:8px 6px}
.rail-foot{margin-top:auto;font-size:.72rem;line-height:1.45;padding:10px;border-radius:8px;background:rgba(255,255,255,.04)}
.rail-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6c7a86;margin-right:6px}
.rail-foot .dot.on{background:#5FC28A}
.main{min-width:0;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));padding-top:12px}
  .mobilehead{display:flex!important}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--rail);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--rail-ink);text-decoration:none;font-size:.66rem;padding:6px 2px;border-radius:7px}
  .tabbar a svg{width:20px;height:20px}
  .tabbar a[aria-current="page"]{color:#fff;background:rgba(254,105,2,.22)}
  h1{font-size:1.35rem}
}
.mobilehead{display:none;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--rail)}
.mobilehead .brand b{font-size:.95rem}
.mobilehead select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:7px;padding:6px 8px;max-width:48%}
.mobilehead select option{color:#000}

/* primitives */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel>header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel>.body{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.split.wide{grid-template-columns:minmax(0,2.1fr) minmax(290px,1fr)}
@media (min-width:861px){.shell{background:linear-gradient(to right,var(--rail) 232px,transparent 232px)}}
@media (max-width:1100px){.split,.split.wide{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:7px;font-weight:600;font-size:.86rem;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--copper);color:var(--copper-ink)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#fff}
.btn.primary:hover{background:var(--copper-ink);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:.78rem}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.76rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=url],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 9px;color:var(--ink);font-size:.88rem;font-weight:400;min-width:0}
input[type=number]{font-family:var(--f-mono)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;border:1px solid var(--line-2);background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.cu{background:var(--copper-soft);color:var(--copper-ink);border-color:transparent}
.chip.navy{background:var(--navy-soft);color:var(--navy);border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:.8rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:.84rem}
table.t th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-2);background:var(--sunk);white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.sum td{font-weight:700;background:var(--sunk)}
table.t tr.grand td{font-weight:700;background:var(--copper-soft);color:var(--copper-ink);border-bottom:0}
table.t tr:hover td{background:color-mix(in srgb,var(--sunk) 60%,transparent)}
table.t input,table.t select{padding:5px 7px;font-size:.82rem}
table.t td.desc{min-width:180px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:1.6rem;line-height:1.1}
.kpi .s{font-size:.76rem;color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}
.note{padding:10px 12px;border-radius:7px;background:var(--navy-soft);color:var(--ink);font-size:.82rem}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.ok{background:var(--ok-soft)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:.84rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.toast-wrap{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(380px,calc(100vw - 32px))}
@media (max-width:860px){.toast-wrap{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}

/* scan */
.drop{border:2px dashed var(--line-2);border-radius:10px;background:var(--sunk);padding:26px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;transition:.15s}
.drop.over{border-color:var(--copper);background:var(--copper-soft)}
.drop svg{width:40px;height:40px;color:var(--copper)}
.drop b{font-family:var(--f-display);font-size:1.1rem}
.formats{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.filelist{display:flex;flex-direction:column;gap:6px}
.fileitem{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.fileitem .ext{font-family:var(--f-mono);font-size:.62rem;font-weight:600;text-transform:uppercase;background:var(--navy-soft);color:var(--navy);border-radius:5px;height:34px;display:grid;place-items:center}
.fileitem .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.step{font-size:.7rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.step::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.step.done::before{background:var(--ok)}
.step.run::before{background:var(--copper);animation:pulse 1s infinite}
.step.fail::before{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.step.run::before{animation:none}}
.result-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 12px}
.result-tabs button{border:0;background:none;padding:10px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;font-size:.84rem}
.result-tabs button[aria-selected="true"]{color:var(--copper-ink);border-bottom-color:var(--copper)}
pre.raw{white-space:pre-wrap;font-family:var(--f-mono);font-size:.74rem;max-height:340px;overflow:auto;background:var(--sunk);padding:12px;border-radius:7px;margin:0}
.conf{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle}
.conf.ai{background:var(--copper)}
.conf.rx{background:var(--navy)}

/* workings sheet look */
.sheet-title{font-family:var(--f-display);font-weight:700;font-stretch:85%;background:var(--copper-soft);color:var(--copper-ink);padding:8px 10px;border-radius:6px 6px 0 0;border:1px solid var(--line);border-bottom:0}
.wtable td,.wtable th{border:1px solid var(--line)!important}
.wtable th{background:var(--navy)!important;color:var(--surface)!important;letter-spacing:.04em}
.mini{width:88px;min-width:84px}
.mini2{min-width:58px}
.mini2{width:62px}
.wtable td{padding:5px 6px}.wtable input,.wtable select{font-size:.8rem;padding:4px 6px}.wtable .basis{margin-top:4px;width:100%;font-size:.72rem;color:var(--muted)}
.bandlbl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px;font-family:var(--f-mono)}
.band{position:relative;height:30px;border-radius:6px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.band .zone{position:absolute;top:0;bottom:0;background:var(--ok-soft)}
.band .mark{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--copper);border-radius:2px}
.band .lbl{position:absolute;bottom:2px;font-size:.62rem;color:var(--muted);font-family:var(--f-mono)}
.bigfig{font-family:var(--f-display);font-stretch:85%;font-weight:800;font-size:2rem;line-height:1}

/* quotation preview */
.paper{background:#fff;color:#1b1b1b;border:1px solid var(--line);border-radius:4px;padding:34px 38px;font-family:"IBM Plex Sans",Arial,sans-serif;font-size:12.5px;line-height:1.5;max-width:820px;margin:0 auto;box-shadow:var(--shadow)}
.paper .lh{display:flex;gap:14px;align-items:center;border-bottom:3px solid #FE6902;padding-bottom:12px;margin-bottom:14px}
.paper .lh h2{font-size:17px;color:#02315B;font-stretch:90%}
.paper .lh small{display:block;color:#555;font-size:11px}
.paper table{width:100%;border-collapse:collapse;margin:10px 0}
.paper th,.paper td{border:1px solid #9aa4ad;padding:6px 8px;vertical-align:top}
.paper th{background:#02315B;color:#fff;font-size:11px;text-align:left}
.paper td.n{text-align:right;font-family:"IBM Plex Mono",monospace;overflow-wrap:anywhere}
#paper .paper{padding:24px 22px;font-size:11.5px}
#paper .paper td.n{font-size:10px;letter-spacing:-.02em}#paper .paper th{font-size:10px}
.paper th{overflow-wrap:anywhere}
.paper ol{padding-left:18px;margin:6px 0}
.paper .tc h4{font-size:12px;margin:10px 0 2px;color:#02315B}
.paper .tc p{margin:2px 0}
@media (max-width:640px){.paper{padding:18px 14px;font-size:11.5px}}
.clause{border:1px solid var(--line);border-radius:7px;padding:8px 10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.clause textarea{min-height:56px;font-size:.8rem}
.clause input[type=text]{font-weight:600}

/* charts */
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.chart .lab{fill:var(--ink);font-family:var(--f-body);font-size:11px}
.bar{fill:var(--navy)}
.bar.hi{fill:var(--copper)}
.compare-best{background:var(--ok-soft)!important;color:var(--ok);font-weight:700}
details.adv>summary{cursor:pointer;font-weight:600;color:var(--copper-ink);list-style:none}
details.adv>summary::-webkit-details-marker{display:none}
.hr{height:1px;background:var(--line);margin:4px 0}
.confirm{display:inline-flex;gap:6px;align-items:center}
.status-sel{border-radius:999px;padding:3px 8px;font-size:.75rem;font-weight:600;width:auto}
/* share sheet */
.sheet-ov{position:fixed;inset:0;z-index:95;background:rgba(2,20,38,.45);display:flex;align-items:flex-end;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-ov{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);width:min(560px,100%);border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
@media (min-width:700px){.sheet{border-radius:14px}}
.fmt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}
.fmt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);cursor:pointer;text-align:left}
.fmt b{font-family:var(--f-mono);font-size:.8rem;color:var(--copper-ink)}
.fmt span{font-size:.74rem;color:var(--muted)}
.fmt[aria-pressed="true"]{border-color:var(--copper);box-shadow:0 0 0 3px var(--copper-soft);background:var(--copper-soft)}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.share-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;font-size:.78rem}
.share-btn svg{width:24px;height:24px;color:var(--navy)}
.share-btn.wa svg{color:#1FAF5A}
.share-btn:hover{border-color:var(--copper)}
.brand b sup{font-size:.5em;letter-spacing:0;margin-left:1px;vertical-align:super}

/* ---- sign-in, admin, search ---- */
body.locked{overflow:hidden}
.auth-ov{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:radial-gradient(1200px 600px at 10% -10%,rgba(254,105,2,.22),transparent 60%),radial-gradient(900px 600px at 110% 110%,rgba(2,169,240,.22),transparent 60%),#02315B}
.auth-card{background:var(--surface);color:var(--ink);width:min(420px,100%);border-radius:16px;padding:24px 22px 16px;box-shadow:0 24px 60px rgba(0,0,0,.35);border-top:5px solid #FE6902;margin:auto}
.auth-card h2{margin:14px 0 12px;font-size:1.35rem}
.auth-brand{display:flex;gap:10px;align-items:center}.auth-brand img{width:44px;height:44px;object-fit:contain}
.auth-brand b{display:block;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;color:#02315B}.auth-brand small{color:var(--muted);font-size:.78rem}
:root[data-theme="dark"] .auth-brand b{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .auth-brand b{color:#fff}}
.auth-links{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;flex-wrap:wrap}
.auth-links a,.auth-foot a{color:var(--copper-ink);font-weight:600;text-decoration:none}
.auth-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
.auth-foot svg{width:13px;height:13px;vertical-align:-2px}
.btn.block{width:100%;justify-content:center}
.small{font-size:.8rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.user-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;margin:0 8px 6px;border-radius:10px;background:rgba(255,255,255,.06)}
.user-chip .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#FE6902;color:#fff;font-weight:700}
.user-chip .who{min-width:0;flex:1;line-height:1.2}.user-chip .who b{display:block;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-chip .who small{display:block;font-size:.68rem;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{margin-left:auto;background:#FE6902;color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 7px}
.tone-ok{color:var(--ok,#1a7f37)}.tone-warn{color:#b54708}.tone-bad{color:#b42318}
kbd{font-family:var(--f-mono,monospace);font-size:.68rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px}
.sheet.gs{padding:0;overflow:hidden;display:flex;flex-direction:column;align-self:flex-start;margin-top:8vh}
.gs-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.gs-in svg{width:18px;height:18px;flex:none;color:var(--muted)}
.gs-in input{border:0;outline:0;background:transparent;font-size:1rem;flex:1;min-width:0;padding:4px 0;box-shadow:none}
.gs-r{max-height:60vh;overflow:auto;padding:6px}
.gs-item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:inherit;cursor:pointer;font:inherit}
.gs-item:hover,.gs-item:focus{background:var(--surface-2,rgba(2,49,91,.06));outline:0}
.gs-item small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--copper-ink);font-weight:700}
.gs-item b{display:block;font-size:.9rem}.gs-item span{display:block;font-size:.76rem;color:var(--muted)}

async function runScan(files, opts) {
  const s = { id: uid(), files: files.map(f => ({ name: f.name, size: f.size })), fileObjs: files, steps: [], status: "run", docs: [] };
  STATE.scans.unshift(s); STATE.selScan = s.id;
  const step = (label, state = "run") => { const last = s.steps[s.steps.length - 1]; if (last && last.state === "run") last.state = "done"; s.steps.push({ label, state }); drawScanList(); };
  try {
    for (const f of files) {
      step("Reading " + (files.length > 1 ? f.name.slice(0, 18) : extOf(f.name).toUpperCase()));
      try { s.docs.push(await readFileAny(f, msg => { s.steps[s.steps.length - 1].label = msg; drawScanList(); })); }
      catch (e) { s.steps[s.steps.length - 1].state = "fail"; s.docs.push({ name: f.name, text: "", rows: [], images: [], note: "Could not read: " + (e.message || e) }); }
    }
    if (!(opts.ai && CAP.sample) && !CAP.inViewer && s.docs.some(d => d.images?.length && (d.text || "").length < 80)) {
      step("Reading photo text (OCR)");
      try { for (const d of s.docs) if (d.images?.length && (d.text || "").length < 80) { d.text = await ocrImages(d.images, m => { s.steps[s.steps.length - 1].label = m; drawScanList(); }); d.rows = textRows(d.text); d.note = "Read by on-device OCR — check the figures against the photo."; } }
      catch (e) { s.steps[s.steps.length - 1].state = "fail"; }
    }
    step("Separating details");
    const local = localExtract(s.docs);
    let ai = null;
    if (opts.ai && CAP.sample) {
      step("Rivera AI reading");
      s.ctl = new AbortController();
      try { ai = await aiExtract(s.docs, s.ctl.signal); }
      catch (e) { s.steps[s.steps.length - 1].state = "fail"; s.aiError = sampleErr(e?.code); }
    }
    step("Checking amounts");
    const R = verify(mergeExtract(local, ai)); R.scanId = s.id; R.fileNames = s.files.map(f => f.name).join(", ");
    s.result = R; s.status = "done"; s.steps[s.steps.length - 1].state = "done";
    s.tab = "summary";
  } catch (e) { s.status = "error"; s.error = e.message || String(e); const l = s.steps[s.steps.length - 1]; if (l) l.state = "fail"; }
  drawScanList(); drawResult();
}

  <p style="margin:10px 0 2px"><b>To</b></p><p style="margin:0;white-space:pre-line">${esc([Q.to.contact, Q.to.name, Q.to.address, Q.to.email && "Email: " + Q.to.email, Q.to.phone && "Phone: " + Q.to.phone, Q.to.gstin && "GST No.: " + Q.to.gstin].filter(Boolean).join("\n"))}</p>

  ${Q.lines.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.desc)}</td><td class="n">${l.unit === "LS" ? "LS" : fmt(l.qty, cur, 0) + (l.unit && l.unit !== "Nos" ? " " + esc(l.unit) : "")}</td><td class="n">${fmt(l.rate, cur)}</td><td class="n">${fmt(qLineAmt(l), cur)}</td></tr>`).join("")}

  <p><b>Amount in words:</b> ${esc(amountInWords(Q.showGst ? t.grand : t.sub, cur, Q.incoterm || "EXW"))}</p>${Q.note ? `<p><b>Note:</b> ${esc(Q.note)}</p>` : ""}

  ${Q.bank ? `<h4>OUR BANK DETAILS</h4><p>Bank Name: ${esc(SETTINGS.bank.name)}<br>Account No: ${esc(SETTINGS.bank.acc)} · Type: ${esc(SETTINGS.bank.type)}<br>IFSC: ${esc(SETTINGS.bank.ifsc)} · MICR: ${esc(SETTINGS.bank.micr)} · SWIFT: ${esc(SETTINGS.bank.swift)}<br>Branch: ${esc(SETTINGS.bank.branch)}</p>` : ""}</div>
  <p style="margin-top:14px">Hope our quotation is in line with your expectation and we look forward to your valuable Purchase Order.</p><p><b>For ${esc(C.name)},</b></p><p style="margin-top:34px">${esc(C.signatory || "Authorized Signature")}</p></div>`;

function drawQLines() {
  const Q = STATE.quote, tb = $("#qLines"); if (!tb) return; const cur = Q.currency;
  tb.innerHTML = Q.lines.map((l, i) => `<tr><td class="mono">${i + 1}</td><td class="desc"><textarea data-p="lines.${i}.desc" rows="2" style="min-height:44px">${esc(l.desc)}</textarea></td>
    <td class="n"><input class="mini2" style="width:76px" type="number" step="any" data-p="lines.${i}.qty" value="${l.qty}"></td>
    <td><select data-p="lines.${i}.unit" style="width:74px">${["Nos", "Set", "LS", "Kg", "Mtr", "Roll"].map(u => `<option ${u === l.unit ? "selected" : ""}>${u}</option>`).join("")}</select></td>
    <td class="n"><input class="mini" type="number" step="any" data-p="lines.${i}.${l.unit === "LS" ? "amount" : "rate"}" value="${l.unit === "LS" ? (l.amount ?? l.rate ?? 0) : l.rate}"></td>
    <td class="n mono">${fmt(qLineAmt(l), cur)}</td><td><button class="btn ghost sm" data-qdel="${i}" aria-label="Remove line">${icon("x")}</button></td></tr>`).join("");
  $$("[data-qdel]", tb).forEach(b => b.onclick = () => { Q.lines.splice(+b.dataset.qdel, 1); drawQLines(); drawPaper(); });
  Q.lines.forEach(l => { if (l.unit === "LS") { l.qty = 1; l.rate = num(l.amount ?? l.rate); l.amount = l.rate; } });
}
function drawClauses() {
  const Q = STATE.quote, el = $("#clauses"); if (!el) return;
  el.innerHTML = Q.clauses.map((c, i) => `<div class="clause"><input type="checkbox" data-p="clauses.${i}.on" ${c.on ? "checked" : ""} aria-label="Include clause"><div class="stack" style="gap:6px;min-width:0"><div class="row" style="flex-wrap:nowrap"><input type="text" data-p="clauses.${i}.title" value="${esc(c.title)}"><button class="btn ghost sm" data-cup="${i}" aria-label="Move up">↑</button><button class="btn ghost sm" data-cdel="${i}" aria-label="Delete clause">${icon("x")}</button></div><textarea data-p="clauses.${i}.body" rows="3">${esc(c.body)}</textarea></div></div>`).join("");
  $$("[data-cdel]", el).forEach(b => b.onclick = () => { Q.clauses.splice(+b.dataset.cdel, 1); drawClauses(); drawPaper(); });
  $$("[data-cup]", el).forEach(b => b.onclick = () => { const i = +b.dataset.cup; if (!i) return; [Q.clauses[i - 1], Q.clauses[i]] = [Q.clauses[i], Q.clauses[i - 1]]; drawClauses(); drawPaper(); });
}
function drawPaper() { const Q = STATE.quote; const p = $("#paper"); if (p) p.innerHTML = paperHtml(Q); const t = quoteTotals(Q); const c = $("#qTot"); if (c) c.textContent = money(Q.showGst ? t.grand : t.sub, Q.currency, 0); }
async function saveQuoteRecord() {
  const Q = STATE.quote; const t = quoteTotals(Q);
  let rec = STATE.quotes.find(q => q.id === Q.regId) || STATE.quotes.find(q => q.no === Q.no && num(q.rev) === num(Q.rev));
  rec = rec ? clone(rec) : { status: "draft" };
  const fxr = Q.currency === "INR" ? 1 : (SETTINGS.fx[Q.currency] || 0);
  Object.assign(rec, { no: Q.no, rev: num(Q.rev), date: Q.date, fy: fyOf(Q.date), customer: Q.to.name || rec.customer || "Customer", market: Q.currency === "INR" ? "domestic" : "international", subject: Q.subject, currency: Q.currency, total: r2(t.sub), totalINR: r2(t.sub * fxr), qty: Q.lines[0]?.qty, rate: Q.lines[0]?.rate, quote: clone(Q), coilType: rec.coilType || STATE.work?.type || "other", workings: rec.workings || (STATE.work ? clone(STATE.work) : null) });
  if (rec.status === "draft") rec.status = "sent";
  if (await Store.saveQuote(rec)) { Q.regId = rec.id; if (STATE.work) STATE.work.regId = rec.id; saveDrafts(); toast(`Saved ${Q.no}${Q.rev ? "R" + Q.rev : ""} to the register`); }
}

/* ---------- Compare ---------- */
VIEWS.compare = v => {
  const scans = STATE.scans.filter(s => s.result);
  const sel = scans.filter(s => STATE.compareIds.has(s.id));
  v.innerHTML = `<div class="topbar"><div><div class="eyebrow">Vendor & offer comparison</div><h1>Compare quotations</h1><p>Line up vendor quotations from anywhere in the world in one currency. Totals are converted to INR at the Rivera FX rates, ranked L1, L2, L3 the way GeM and tender committees rank them.</p></div></div>
  <section class="panel" style="margin-bottom:16px"><header><h2>Pick quotations</h2><a class="btn sm" href="#scan">${icon("scan")}Scan more</a></header><div class="body">${scans.length ? `<div class="row">${scans.map(s => `<label class="chip ${STATE.compareIds.has(s.id) ? "cu" : ""}" style="cursor:pointer;padding:5px 11px"><input type="checkbox" data-cmp="${s.id}" ${STATE.compareIds.has(s.id) ? "checked" : ""} style="margin:0 4px 0 0">${esc(s.result.party?.name || s.files[0].name)} · ${esc(s.result.currency)}</label>`).join("")}</div>` : `<div class="empty"><b>No scanned quotations yet</b>Scan two or more vendor quotations in Smart Scan, then pick them here.</div>`}</div></section>
  <section class="panel" id="cmpOut"></section>`;
  $$("[data-cmp]").forEach(c => c.onchange = () => { c.checked ? STATE.compareIds.add(c.dataset.cmp) : STATE.compareIds.delete(c.dataset.cmp); render(); });
  const out = $("#cmpOut");
  if (sel.length < 2) { out.innerHTML = `<div class="empty"><b>Select at least two</b>The comparison table, ranking and category breakdown appear here.</div>`; return; }
  const rows = sel.map(s => { const R = s.result; const T = R.totals || {}; const tot = T.grand_total ?? T.subtotal ?? R.computed.items_total; const fx = R.currency === "INR" ? 1 : SETTINGS.fx[R.currency]; const qty = R.coil?.quantity || R.line_items?.find(i => i.qty > 1)?.qty || null; return { s, R, tot, inr: fx ? tot * fx : null, qty, unitInr: fx && qty ? tot * fx / qty : null }; });
  const ranked = [...rows].filter(r => r.inr != null).sort((a, b) => a.inr - b.inr);
  const best = ranked[0];
  const cats = ["copper", "insulation", "manufacturing", "vpi", "testing", "packing", "fixture", "winding_kit", "freight", "service", "other"];
  const catSum = (R, c) => (R.line_items || []).filter(i => i.category === c).reduce((s, i) => s + num(i.amount ?? i.calc), 0);
  out.innerHTML = `<header><h2>Comparison</h2><div class="row"><span class="chip ok">L1: ${esc(best?.R.party?.name || "—")}</span><button class="btn sm" id="cmpX">${icon("dl")}Excel</button></div></header>
  <div class="scroll"><table class="t"><thead><tr><th>Item</th>${rows.map(r => `<th class="n">${esc((r.R.party?.name || r.s.files[0].name).slice(0, 28))}</th>`).join("")}</tr></thead><tbody>
  <tr><td>Rank (INR)</td>${rows.map(r => `<td class="n"><span class="chip ${r === best ? "ok" : ""}">L${ranked.indexOf(r) + 1 || "?"}</span></td>`).join("")}</tr>
  <tr><td>Country · currency</td>${rows.map(r => `<td class="n">${esc(r.R.party?.country || "—")} · ${esc(r.R.currency)}</td>`).join("")}</tr>
  <tr><td>Quoted total</td>${rows.map(r => `<td class="n mono">${money(r.tot, r.R.currency)}</td>`).join("")}</tr>
  <tr><td>Total in INR</td>${rows.map(r => `<td class="n mono ${r === best ? "compare-best" : ""}">${r.inr != null ? money(r.inr, "INR", 0) : "set FX"}</td>`).join("")}</tr>
  <tr><td>vs L1</td>${rows.map(r => `<td class="n mono">${r.inr != null && best ? (r === best ? "—" : "+" + ((r.inr / best.inr - 1) * 100).toFixed(1) + "%") : "—"}</td>`).join("")}</tr>
  <tr><td>Quantity</td>${rows.map(r => `<td class="n mono">${r.qty ?? "—"}</td>`).join("")}</tr>
  <tr><td>Per unit (INR)</td>${rows.map(r => `<td class="n mono">${r.unitInr ? money(r.unitInr, "INR", 0) : "—"}</td>`).join("")}</tr>
  ${cats.filter(c => rows.some(r => catSum(r.R, c))).map(c => `<tr><td style="text-transform:capitalize">${c.replace("_", " ")}</td>${rows.map(r => `<td class="n mono">${catSum(r.R, c) ? fmt(catSum(r.R, c), r.R.currency) : "—"}</td>`).join("")}</tr>`).join("")}
  ${["payment", "delivery", "validity", "warranty"].map(k => `<tr><td style="text-transform:capitalize">${k}</td>${rows.map(r => `<td style="min-width:180px;font-size:.78rem">${esc(r.R.terms?.[k] || "—")}</td>`).join("")}</tr>`).join("")}
  <tr><td>Price basis</td>${rows.map(r => `<td class="n">${esc(r.R.incoterm || "—")}</td>`).join("")}</tr>
  <tr><td>Arithmetic</td>${rows.map(r => `<td class="n">${r.R.issues?.length ? `<span class="chip warn">${r.R.issues.length} issue(s)</span>` : `<span class="chip ok">OK</span>`}</td>`).join("")}</tr>
  </tbody></table></div>`;
  $("#cmpX").onclick = async () => {
    const cells = [[{ v: "VENDOR COMPARISON — " + dmy(todayISO()), s: 1 }], ["Item", ...rows.map(r => r.R.party?.name || r.s.files[0].name)].map(v => ({ v, s: 2 }))];
    const add = (l, f, s = 3) => cells.push([{ v: l, s: 5 }, ...rows.map(r => ({ v: f(r) ?? "", s }))]);
    add("Rank", r => "L" + (ranked.indexOf(r) + 1)); add("Currency", r => r.R.currency); add("Quoted total", r => r.tot, 4); add("Total INR", r => r.inr, 6); add("Quantity", r => r.qty, 8); add("Per unit INR", r => r.unitInr, 4);
    cats.forEach(c => { if (rows.some(r => catSum(r.R, c))) add(c, r => catSum(r.R, c) || "", 4); });
    ["payment", "delivery", "validity", "warranty"].forEach(k => add(k, r => r.R.terms?.[k] || ""));
    saveFile(`VENDOR_COMPARISON_${todayISO()}.xlsx`, await buildXlsx([{ name: "Comparison", cells, cols: [22, ...rows.map(() => 30)] }, ...rows.map(r => scanSheet(r.R)).map((s, i) => ({ ...s, name: ("Extract " + (i + 1)) }))]));
  };
};

/* ---------- Rate card & company settings ---------- */
VIEWS.ratecard = v => {

async function jobFiles(q) {
  const files = []; const base = safeName(`${(q.no || "QT").replace(/\//g, "_")}${q.rev ? "R" + q.rev : ""}_${q.customer}`);
  if (q.quote) { files.push([base + ".pdf", await quotePdf(q.quote)]); files.push([base + ".docx", await buildDocx(quoteBlocks(q.quote), brandLogo())]); }
  if (q.workings) files.push([`QUOTE WORKINGS_${safeName(q.customer)}.xlsx`, await buildXlsx([workingsSheet(q.workings)])]);
  if (q.source?.result) files.push([`SCAN EXTRACT_${safeName(q.customer)}.xlsx`, await buildXlsx([scanSheet(q.source.result)])]);
  files.push(["job.json", new Blob([JSON.stringify(q, null, 1)], { type: "application/json" })]);
  const scan = STATE.scans.find(s => s.result && (s.result.scanId === q.workings?.sourceScanId || s.result.fileNames === q.source?.fileNames));
  if (scan) for (const f of scan.fileObjs) files.push(["source/" + f.name, f]);
  return files;
}
async function synologyPackage(q, opt = {}) {
  if (!q) return;
  try {
    if (!opt.silent) toast("Preparing " + (q.no || "job") + "…");
    const files = await jobFiles(q);
    const nn = (/QT\/0*(\d+)/.exec(q.no || "") || [])[1]; const folder = `${nn ? String(nn).padStart(3, "0") + "_" : ""}${q.date || todayISO()}_${safeName(q.customer).toUpperCase()}`;
    const fyDir = "F.Y 20" + (q.fy || fyOf(q.date));
    if (STATE.dir) {
      let d = STATE.dir; for (const p of ["RCM", "2) QUOTATION", fyDir, folder]) d = await d.getDirectoryHandle(p, { create: true });
      for (const [name, blob] of files) { let dd = d; const parts = name.split("/"); for (const p of parts.slice(0, -1)) dd = await dd.getDirectoryHandle(p, { create: true }); const fh = await dd.getFileHandle(parts[parts.length - 1], { create: true }); const ws = await fh.createWritable(); await ws.write(blob); await ws.close(); }
      toast(`Filed to ${STATE.dir.name}/RCM/2) QUOTATION/${fyDir}/${folder}`); return;
    }
    const S = SETTINGS.synology;
    if (!CAP.inViewer && S.url && S.user) { const ok = await fileStationUpload(files, `${(S.root || "/SALES").replace(/\/+$/, "")}/RCM/2) QUOTATION/${fyDir}/${folder}`); if (ok) return; }
    const JSZip = await getZip(); const z = new JSZip(); const root = ((S.root || "/SALES").replace(/^\/+/, "").replace(/\/+$/, "") || "SALES") + "/RCM/2) QUOTATION";
    for (const [name, blob] of files) z.file(`${root}/${fyDir}/${folder}/${name}`, blob);
    await saveFile(`${folder}.zip`, await z.generateAsync({ type: "blob" }));
  } catch (e) { toast("Packaging failed: " + (e.message || e), "bad"); }
}
async function fileStationUpload(files, path) {
  const S = SETTINGS.synology;
  const pw = await askPassword(); if (!pw) return false;
  try {
    const base = S.url.replace(/\/+$/, "");
    const lr = await (await fetch(`${base}/webapi/entry.cgi?api=SYNO.API.Auth&version=6&method=login&account=${encodeURIComponent(S.user)}&passwd=${encodeURIComponent(pw)}&session=FileStation&format=sid`)).json();
    if (!lr.success) { toast("NAS login failed (code " + (lr.error?.code || "?") + "). Check the user and password.", "bad"); return false; }
    const sid = lr.data.sid;
    for (const [name, blob] of files) {
      const parts = name.split("/"); const dir = path + (parts.length > 1 ? "/" + parts.slice(0, -1).join("/") : "");
      const fd = new FormData(); fd.append("api", "SYNO.FileStation.Upload"); fd.append("version", "2"); fd.append("method", "upload"); fd.append("path", dir); fd.append("create_parents", "true"); fd.append("overwrite", "true"); fd.append("file", blob, parts[parts.length - 1]);
      const ur = await (await fetch(`${base}/webapi/entry.cgi?_sid=${encodeURIComponent(sid)}`, { method: "POST", body: fd })).json();
      if (!ur.success) throw new Error("upload error " + (ur.error?.code || ""));
    }
    fetch(`${base}/webapi/entry.cgi?api=SYNO.API.Auth&version=6&method=logout&session=FileStation&_sid=${encodeURIComponent(sid)}`).catch(() => { });
    toast("Uploaded to NAS: " + path); return true;
  } catch (e) { toast("Couldn't reach the NAS from this browser (" + (e.message || e) + "). Downloading the ZIP instead.", "bad"); return false; }
}
function askPassword() {
  return new Promise(res => {
    const wrap = document.createElement("div"); wrap.className = "toast"; wrap.style.background = "var(--surface)"; wrap.style.color = "var(--ink)"; wrap.style.border = "1px solid var(--line)";
    wrap.innerHTML = `<label class="f">DSM password for ${esc(SETTINGS.synology.user)}<input type="password" id="dsmPw" autocomplete="current-password"></label><div class="row" style="margin-top:8px"><button class="btn sm primary" id="pwOk">Upload</button><button class="btn sm" id="pwNo">Cancel</button></div>`;
    $("#toasts").appendChild(wrap); $("#dsmPw").focus();
    const done = v => { wrap.remove(); res(v); };
    $("#pwOk").onclick = () => done($("#dsmPw").value); $("#pwNo").onclick = () => done(null); $("#dsmPw").onkeydown = e => { if (e.key === "Enter") done(e.target.value); };
  });
}

function openLink(href) { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove(); }
async function shareBlob(name, blob, text, target) {

  try { const f = new File([blob], name, { type: blob.type }); if (navigator.canShare?.({ files: [f] })) { await navigator.share({ files: [f], title: name, text: text || name }); return; } } catch (e) { if (e?.name === "AbortError") return; }
  await saveFile(name, blob);
  if (target === "whatsapp") openLink("https://wa.me/?text=" + encodeURIComponent((text || name) + "\n(" + name + " saved — attach it in WhatsApp)"));
  else if (target === "email") openLink("mailto:?subject=" + encodeURIComponent(name) + "&body=" + encodeURIComponent((text || "") + "\n\nPlease find attached: " + name));
  else toast("Saved " + name + ". Attach it in any app.");
}
function shareText(text, target) {
  if (window.RiveraAndroid?.shareText) { window.RiveraAndroid.shareText(text, target || ""); return; }
  if (target === "whatsapp") return openLink("https://wa.me/?text=" + encodeURIComponent(text));
  if (target === "email") return openLink("mailto:?body=" + encodeURIComponent(text));
  if (navigator.share) { navigator.share({ text }).catch(() => { }); return; }
  navigator.clipboard?.writeText(text).then(() => toast("Copied — paste it in any app"), () => toast(text));
}

  const put = (o, t) => { const n = (o.name || "").trim(); if (!n) return; const k = n.toLowerCase(); const c = M.get(k) || { name: n, t: 0 }; if (t >= c.t) { for (const f of ["contact", "email", "phone", "gstin", "address"]) if (o[f]) c[f] = o[f]; c.t = t; } else for (const f of ["contact", "email", "phone", "gstin", "address"]) if (o[f] && !c[f]) c[f] = o[f]; M.set(k, c); };
  for (const q of STATE.quotes) put(q.quote?.to || { name: q.customer, email: q.email }, num(q.updatedAt));
  for (const h of HISTORY) put({ name: h.customer || h.project }, 0);
  return M;
}
const _quote7 = VIEWS.quote;
VIEWS.quote = v => {
  _quote7(v);
  if (!Auto.cfg.customer) return;
  const inp = $('[data-p="to.name"]', v); if (!inp) return;
  const M = customerMaster(); if (!M.size) return;
  const dl = document.createElement("datalist"); dl.id = "custList"; dl.innerHTML = [...M.values()].map(c => `<option value="${esc(c.name)}">`).join(""); v.appendChild(dl); inp.setAttribute("list", "custList"); inp.setAttribute("autocomplete", "off");
  const fill = () => {
    const c = M.get(inp.value.trim().toLowerCase()); if (!c) return; let n = 0;
    for (const f of ["contact", "email", "phone", "gstin", "address"]) { const el = $(`[data-p="to.${f}"]`, v); if (el && !el.value.trim() && c[f]) { el.value = c[f]; el.dispatchEvent(new Event("input", { bubbles: true })); n++; } }
    if (n) toast(`Filled ${n} customer detail${n > 1 ? "s" : ""} from earlier quotations`);
  };
  inp.addEventListener("change", fill);
};

/* ---------- 6. dashboard: health strip + daily summary ---------- */
const _home7 = VIEWS.home;
VIEWS.home = v => {
  _home7(v);
  healthChecks().then(H => {
    if (STATE.route !== "home") return; const bad = H.filter(h => h.sev === "bad"), warn = H.filter(h => h.sev === "warn");
    const row = $("#gsBtn", v)?.parentElement; if (!row || $("#hStrip", v)) return;
    row.insertAdjacentHTML("beforeend", `<button class="btn sm" id="hStrip">${icon("health")}${bad.length ? `<span class="chip bad">${bad.length} to fix</span>` : warn.length ? `<span class="chip warn">${warn.length} warnings</span>` : `<span class="chip ok">All good</span>`}</button><button class="btn sm" id="dSum">${icon("wa")}Today's summary</button>`);
    $("#hStrip", v).onclick = () => location.hash = "health"; $("#dSum", v).onclick = () => shareText(Auto.digest(), "whatsapp");
  });
};

/* ---------- boot ---------- */
const _boot7 = boot;
boot = function () {
  _boot7(); hookReceive();
  const go = () => { Auto.run(); healthBadge(); packFromDir(); };
  const wait = setInterval(() => { if (STATE.loaded) { clearInterval(wait); setTimeout(go, 1500); } }, 300);
  setInterval(() => Auto.run(), 30 * 60000);
  addEventListener("online", healthBadge); addEventListener("offline", healthBadge);
};
boot();
