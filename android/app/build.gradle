plugins {
    id 'com.android.application'
}

def ksPath = System.getenv('RIVERA_KEYSTORE')
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.rivera.quotestudio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rivera.quotestudio'
        minSdk 24
        targetSdk 34
        versionCode runNo
        versionName "1.0.${runNo}"
    }

    buildFeatures { buildConfig true }

    /* two apps from one code: the full Rivera app, and a Rivera Courier app for security (opens straight on the courier / visitor gate) */
    flavorDimensions 'app'
    productFlavors {
        full {
            dimension 'app'
            resValue 'string', 'app_name', 'Rivera Quotes'
            buildConfigField 'String', 'START_PAGE', '"index.html#home"'
        }
        courier {
            dimension 'app'
            applicationIdSuffix '.courier'
            resValue 'string', 'app_name', 'Rivera Courier'
            buildConfigField 'String', 'START_PAGE', '"index.html?app=courier#courier"'
        }
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv('RIVERA_KS_PASS')
                keyAlias 'rivera'
                keyPassword System.getenv('RIVERA_KS_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
